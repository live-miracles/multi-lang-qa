<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none" stroke="#dc2626" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <clipPath id="qg">
      <circle cx="50" cy="50" r="33"/>
    </clipPath>
  </defs>
  <circle cx="50" cy="50" r="47" fill="#fff" stroke="none"/>
  <!-- Globe outer circle - doubles as the Q's body -->
  <circle cx="50" cy="50" r="33" stroke-width="7"/>
  <!-- Equator -->
  <line x1="17" y1="50" x2="83" y2="50" stroke-width="4.5" clip-path="url(#qg)"/>
  <!-- Central meridian (vertical oval) -->
  <ellipse cx="50" cy="50" rx="13" ry="33" stroke-width="4.5" clip-path="url(#qg)"/>
  <!-- Upper parallel -->
  <line x1="24" y1="33" x2="76" y2="33" stroke-width="3.25" clip-path="url(#qg)"/>
  <!-- Lower parallel -->
  <line x1="24" y1="67" x2="76" y2="67" stroke-width="3.25" clip-path="url(#qg)"/>
  <!-- Gap around Q tail -->
  <line x1="60" y1="65" x2="88" y2="80" stroke="#fff" stroke-width="13"/>
  <!-- Q tail -->
  <line x1="60" y1="65" x2="88" y2="80" stroke-width="7.5"/>
</svg>
